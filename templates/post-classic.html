<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>{{BUCKET_TITLE}} jobs</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --band: {{COLOR}};
    --band-ink: {{INK}};
    --paper: #F5F7FA;
    --ink: #15181E;
    --muted: #5B6472;
    --rule: #DCE1E8;
    --pill: #E8ECF2;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1350px; }
  body {
    background: var(--paper);
    color: var(--ink);
    font-family: 'IBM Plex Sans', system-ui, sans-serif;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* Header band — the one bold element */
  .band {
    background: var(--band);
    color: var(--band-ink);
    padding: 40px 64px 30px;
    position: relative;
  }
  .meta {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    font-size: 24px;
    font-weight: 500;
    opacity: .85;
  }
  .bucket {
    font-family: 'Bricolage Grotesque', system-ui, sans-serif;
    font-weight: 800;
    font-size: {{TITLE_SIZE}}px;
    line-height: .95;
    letter-spacing: -0.035em;
    margin-top: 20px;
  }
  .sub {
    font-size: 26px;
    margin-top: 12px;
    opacity: .9;
  }

  /* Job list */
  .list { flex: 1; padding: 4px 64px 0; display: flex; flex-direction: column; justify-content: space-evenly; min-height: 0; }
  .job {
    display: grid;
    grid-template-columns: 72px 1fr;
    column-gap: 24px;
    padding: 13px 0;
    border-bottom: 2px solid var(--rule);
  }
  .job:last-child { border-bottom: 0; }
  .logo {
    width: 72px; height: 72px;
    border-radius: 14px;
    background: #fff;
    border: 2px solid var(--rule);
    overflow: hidden;
    display: grid; place-items: center;
    font-family: 'Bricolage Grotesque', sans-serif;
    font-weight: 700; font-size: 30px; color: var(--muted);
  }
  .logo img { width: 100%; height: 100%; object-fit: contain; }
  .title {
    font-family: 'Bricolage Grotesque', sans-serif;
    font-weight: 700;
    font-size: 30px;
    line-height: 1.12;
    letter-spacing: -0.01em;
    display: -webkit-box; -webkit-line-clamp: 1; -webkit-box-orient: vertical; overflow: hidden;
  }
  .where {
    font-size: 21px;
    color: var(--muted);
    margin-top: 4px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .where b { color: var(--ink); font-weight: 600; }
  .summary {
    font-size: 20px;
    line-height: 1.36;
    margin-top: 7px;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }
  .skills { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; max-height: 34px; overflow: hidden; }
  .skills span {
    background: var(--pill);
    border-radius: 999px;
    padding: 4px 13px;
    font-size: 17px;
    font-weight: 500;
  }

  .foot {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 16px 64px 22px;
    font-size: 21px;
    color: var(--muted);
    border-top: 6px solid var(--band);
    flex-shrink: 0;
  }
  .foot .brand { font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; color: var(--ink); font-size: 23px; }
</style>
</head>
<body>
  <header class="band">
    <div class="meta"><span>{{BRAND}}</span><span>{{DATE}}</span></div>
    <h1 class="bucket">{{BUCKET_TITLE}}</h1>
    <p class="sub">{{COUNT_LINE}}</p>
  </header>
  <main class="list">
    {{JOBS}}
  </main>
  <footer class="foot">
    <span>Apply links are in the post caption</span>
    <span class="brand">{{PAGE}}</span>
  </footer>
</body>
</html>
